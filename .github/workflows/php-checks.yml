name: PHP checks

on:
  push:
    branches:
      - main
      - development/adguard-pro
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, curl, openssl
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install dependencies and generate autoloader
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Apply fresh MySQL schema and seed data
        run: |
          mysql --host=127.0.0.1 --user=root --password=root < schema.sql
          mysql --host=127.0.0.1 --user=root --password=root adguard < seeders.sql

      - name: Lint all PHP files
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run unit regression checks
        run: php tests/run.php
