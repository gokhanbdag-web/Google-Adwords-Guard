name: PHP validation

on:
  push:
    branches:
      - main
      - 'integration/**'
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, openssl, curl, mbstring
          coverage: none
      - name: Validate Composer manifest
        run: composer validate --no-check-publish
      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find app bootstrap config public routes resources -type f -name '*.php' -print0)
